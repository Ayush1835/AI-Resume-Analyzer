{% extends "base.html" %}

{% block title %}Login - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card-glass fade-in">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-lock fa-3x mb-3 text-primary"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary">Sign in to evaluate your resume</p>
            </div>
            
            <!-- Success / Error alerts -->
            <div id="successAlert" class="alert alert-success d-none" role="alert">
                Registration successful! Please log in.
            </div>
            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-secondary">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-color text-secondary"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control form-control-custom" id="email" required placeholder="name@domain.com">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-tertiary border-color text-secondary"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control form-control-custom" id="password" required placeholder="••••••••">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                </button>
            </form>
            
            <div class="text-center">
                <p class="text-secondary mb-0">Don't have an account? <a href="/register" class="text-primary fw-bold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Show success alert if registered URL parameter is present
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
        document.getElementById('successAlert').classList.remove('d-none');
    }
</script>
{% endblock %}
